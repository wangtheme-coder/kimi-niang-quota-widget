<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimi 娘额度挂件</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="widget" id="widget">
    <section class="bubble" id="bubble" aria-label="Kimi 额度" aria-hidden="true">
      <header class="bubble-header">
        <div>
          <strong>Kimi 额度</strong>
          <span class="source" id="source">读取中</span>
        </div>
        <button class="icon-button" id="refresh" type="button" title="刷新额度" aria-label="刷新额度">↻</button>
      </header>

      <div class="quota" id="quota-5h">
        <div class="quota-heading">
          <span>5 小时限额</span>
          <strong><span class="percent">--</span><small> 已用</small></strong>
        </div>
        <div class="track" role="progressbar" aria-label="5 小时限额使用量" aria-valuemin="0" aria-valuemax="100">
          <div class="fill"></div>
        </div>
        <div class="quota-meta"><span class="remaining">等待额度数据</span><span class="reset"></span></div>
      </div>

      <div class="quota" id="quota-30d">
        <div class="quota-heading">
          <span>30 天限额</span>
          <strong><span class="percent">--</span><small> 已用</small></strong>
        </div>
        <div class="track monthly" role="progressbar" aria-label="30 天限额使用量" aria-valuemin="0" aria-valuemax="100">
          <div class="fill"></div>
        </div>
        <div class="quota-meta"><span class="remaining">等待额度数据</span><span class="reset"></span></div>
      </div>

      <footer>
        <span id="status">正在寻找 Kimi 登录状态…</span>
        <time id="updated"></time>
      </footer>
    </section>

    <button class="character" id="character" type="button" title="单击查看额度，拖动空白处移动，右键设置" aria-label="展开或收起额度" aria-expanded="false">
      <span class="character-shadow"></span>
      <span class="placeholder" id="placeholder" aria-hidden="true">
        <span class="hair hair-back"></span>
        <span class="ear ear-left"></span>
        <span class="ear ear-right"></span>
        <span class="face">
          <span class="eye eye-left"></span>
          <span class="eye eye-right"></span>
          <span class="mouth"></span>
        </span>
        <span class="hair hair-front"></span>
        <span class="body-shape"></span>
        <span class="moon">☾</span>
      </span>
      <img class="character-image" id="character-image" src="../assets/kimi-niang.png" alt="Kimi 娘" draggable="false">
      <span class="online-dot" id="online-dot"></span>
    </button>
  </main>
  <script src="audio.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
